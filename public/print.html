<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Cetak Voucher Hotspot</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Courier New', monospace; }
        body { background: #f1f5f9; padding: 10px; }
        .no-print { margin-bottom: 12px; display: flex; gap: 8px; }
        
        .sheet-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
            background: #fff;
            padding: 8px;
        }
        .voucher-card {
            border: 1.5px dashed #334155;
            padding: 6px;
            text-align: center;
            break-inside: avoid;
            page-break-inside: avoid;
        }
        .v-header { font-weight: bold; font-size: 11px; border-bottom: 1px solid #cbd5e1; padding-bottom: 3px; }
        .v-code { font-size: 15px; font-weight: bold; margin: 6px 0; letter-spacing: 1px; background: #f8fafc; padding: 3px; }
        .v-meta { font-size: 10px; color: #334155; }

        .sheet-thermal-58 { width: 58mm; background: #fff; padding: 2mm; }
        .sheet-thermal-80 { width: 80mm; background: #fff; padding: 3mm; }
        .sheet-thermal-58 .voucher-card,
        .sheet-thermal-80 .voucher-card {
            border: none;
            border-bottom: 1px dashed #000;
            padding: 6px 0;
            margin-bottom: 4px;
        }

        @media print {
            body { background: #fff; padding: 0; }
            .no-print { display: none !important; }
            @page { margin: 4mm; }
        }
    </style>
</head>
<body>
    <div class="no-print">
        <button onclick="setMode('grid')">Grid Kertas (A4/F4)</button>
        <button onclick="setMode('thermal-58')">Thermal 58mm</button>
        <button onclick="setMode('thermal-80')">Thermal 80mm</button>
        <button onclick="window.print()" style="font-weight:bold;">🖨️ PRINT SEKARANG</button>
    </div>

    <div id="container" class="sheet-grid"></div>

    <script>
        const params = new URLSearchParams(location.search);
        const batchId = params.get('batchId');
        let currentMode = params.get('mode') || 'grid';

        function setMode(mode) {
            currentMode = mode;
            const el = document.getElementById('container');
            el.className = mode === 'grid' ? 'sheet-grid' : `sheet-${mode}`;
        }

        async function loadBatch() {
            setMode(currentMode);
            const res = await fetch(`/api/v1/vouchers/batch/${batchId}/print`, {
                headers: { 'Authorization': 'Bearer ' + localStorage.getItem('token') }
            });
            const data = await res.json();
            const container = document.getElementById('container');
            container.innerHTML = data.vouchers.map((v, idx) => `
                <div class="voucher-card">
                    <div class="v-header">${data.profile.display_name} • Rp ${Number(v.sale_price).toLocaleString('id-ID')}</div>
                    ${data.batch.auth_mode === 'same'
                        ? `<div class="v-code">${v.username}</div>`
                        : `<div class="v-code">U: ${v.username}<br>P: ${v.password}</div>`
                    }
                    <div class="v-meta">Speed: ${data.profile.rate_limit} | #${idx + 1} [${data.batch.batch_code}]</div>
                </div>
            `).join('');
        }
        loadBatch();
    </script>
</body>
</html>
